services:
  - type: web
    name: idp-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idp-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: idp-db
    databaseName: idp
    user: idp_user
    region: singapore
    plan: free
